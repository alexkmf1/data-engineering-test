services:

  postgres:
    image: postgres:18
    container_name: freighthero-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  metabase:
    image: metabase/metabase:v0.63.15.5
    container_name: freighthero-metabase

    ports:
      - "3000:3000"

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - metabase_data:/metabase-data

    environment:
      MB_DB_FILE: /metabase-data/metabase.db


volumes:
  postgres_data:
  metabase_data: